name: 分级者
on:
    schedule:
        - cron: "0 20 * * *"
    workflow_dispatch:
permissions:
    contents: read
jobs:
    ranker:
        environment: MoegirlPedia
        runs-on: ubuntu-latest
        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # main
              with:
                  egress-policy: audit
            - name: 准备 Socket Firewall
              uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # main
              with:
                  mode: firewall
                  job-summary: errors
            - name: 签出
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # main
            - name: 准备 node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # main
              with:
                  node-version: lts/*
            - name: 准备 pnpm
              uses: step-security/action-setup@63a18b8579c91d195ffdbd11e1fdf0c2b9700865 # main
              with:
                  version: 12
                  cache: true
            - name: 安装 pnpm 依赖
              run: sfw pnpm install --prod
            - name: 准备 Tailscale
              uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # main
              with:
                  oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
                  oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
                  tags: tag:ci
                  version: latest
            - name: 运行分级者
              env:
                  MOEGIRL_ZH_BOTUSERNAME: ${{ vars.MOEGIRL_ZH_BOTUSERNAME }}
                  MOEGIRL_ZH_BOTPASSWORD: ${{ secrets.MOEGIRL_ZH_BOTPASSWORD }}
                  MOEGIRL_MZH_BOTUSERNAME: ${{ vars.MOEGIRL_MZH_BOTUSERNAME }}
                  MOEGIRL_MZH_BOTPASSWORD: ${{ secrets.MOEGIRL_MZH_BOTPASSWORD }}
                  MOEGIRL_MOEGIRLSSOUSERID: ${{ vars.MOEGIRL_MOEGIRLSSOUSERID }}
                  OTEL_TRACES_EXPORTER: ${{ vars.OTEL_TRACES_EXPORTER }}
                  OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
                  OTEL_EXPORTER_OTLP_INSECURE: ${{ vars.OTEL_EXPORTER_OTLP_INSECURE }}
                  OTEL_NODE_RESOURCE_DETECTORS: ${{ vars.OTEL_NODE_RESOURCE_DETECTORS }}
                  OTEL_SERVICE_NAME: ${{ vars.OTEL_SERVICE_NAME }}
              run: node -r ./logger.js 分级者
