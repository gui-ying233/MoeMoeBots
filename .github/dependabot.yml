version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: daily
      cooldown:
          default-days: 1
      ignore:
          - dependency-name: jsdom
            update-types:
                - version-update:semver-major
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: daily
      cooldown:
          default-days: 1
